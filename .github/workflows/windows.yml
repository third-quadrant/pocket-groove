name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and bundle runtime
        shell: pwsh
        run: ./scripts/build.ps1 -Package
      - uses: actions/upload-artifact@v4
        with:
          name: PocketGroove-0.6.2-windows-x64
          path: dist/PocketGroove-0.6.2-windows-x64.zip
